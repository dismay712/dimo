[supervisord]
user=root
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid

[program:agent]
command=/runner/komari $KOMARI_ARGS -e $KOMARI_SERVER -t $KOMARI_SECRET --disable-web-ssh --interval 5.0 --max-retries 5 --reconnect-interval 10 --info-report-interval 15
autostart=true
autorestart=true
stderr_logfile=/dev/null
stdout_logfile=/dev/null

[program:httpd]
command=/runner/tinyhttp
autostart=true
autorestart=true
stderr_logfile=/dev/null
stdout_logfile=/dev/null
