[supervisord]
user=root
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid

[program:agent]
command=/runner/komari %(ENV_KOMARI_ARGS)s
autostart=true
autorestart=true
stderr_logfile=/dev/null
stdout_logfile=/dev/null

[program:httpd]
command=/runner/tinyhttp
autostart=true
autorestart=true
stderr_logfile=/dev/null
stdout_logfile=/dev/null
